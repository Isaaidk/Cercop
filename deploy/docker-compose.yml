# Despliegue de un solo servidor: PostgreSQL, Redis, API, worker de ingesta y Caddy.
#
# Por qué todo junto y no en servicios gestionados separados
# ----------------------------------------------------------
# Lo que hace lento este sistema no es la capacidad de PostgreSQL: son los ~280 ms que cuesta cada
# bloque de consulta cuando la base está al otro lado de la red, medidos y documentados en
# `docs/`. Con la base en el mismo host ese coste baja a ~1 ms, y esa diferencia pesa más que
# cualquier optimización de código.
#
# Redis local añade una segunda ventaja de coste: el caché de este sistema hace varios comandos por
# petición, y los proveedores gestionados suelen facturar por comando. En local no se factura.
#
# El panel (Vue) NO va aquí: se compila y se sirve desde un CDN, apuntando `VITE_API_BASE` a este
# host. Así el TLS y el reparto global los hace la CDN, que es lo que hace bien.
#
# Puesta en marcha
# ----------------
#   1. Copiar `.env.example` a `.env` en la raíz y completar los valores obligatorios.
#   2. Definir BD_CLAVE, DOMINIO y CORREO_TLS (ver `deploy/README.md`).
#   3. docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   4. Comprobar que está listo:  curl -s http://127.0.0.1:8001/listo

name: contratacion

# Tope a los registros de Docker, y no es un detalle de limpieza: el conductor `json-file` **no
# tiene límite por defecto**, y el API escribe una línea por petición. Con mil paneles abiertos eso
# son millones de líneas al día; el fichero crece hasta llenar el disco y el servidor se cae entero
# —con PostgreSQL dentro, que es quien no puede permitirse quedarse sin sitio—. Tres ficheros de
# 10 MB por servicio acotan cualquier avería de este tipo a 30 MB por servicio.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Datos
  # ---------------------------------------------------------------------------
  bd:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BD_NOMBRE:-contratacion}
      POSTGRES_USER: ${BD_USUARIO:-contratacion}
      POSTGRES_PASSWORD: ${BD_CLAVE:?falta BD_CLAVE en el entorno}
    command:
      # Una máquina dedicada no necesita los valores por defecto de PostgreSQL, pensados para un
      # servidor compartido. Los que importan para mil usuarios concurrentes:
      #
      # - **`max_connections`** decide cuántos procesos caben: el techo real del sistema es la suma
      #   de los pools de todos los procesos de API más el del worker. Con 4 procesos de API y uno
      #   de ingesta, a 20 conexiones cada uno (BD_POOL_SIZE + BD_MAX_OVERFLOW), son 100. 200 deja
      #   margen para la migración y para mirar la base a mano. `scripts/verificar_despliegue.py`
      #   comprueba esta aritmética contra el `.env`.
      # - **`effective_cache_size`** es una pista para el planificador, no memoria reservada: se le
      #   dice cuánta caché hay **en todo el sistema** (el `shared_buffers` más la del sistema
      #   operativo). Con 4 GB de máquina, 3 GB. No cuesta un byte y evita que el planificador
      #   subestime lo que ya está en memoria.
      # - **`random_page_cost`**: 1,1 es lo correcto para disco de estado sólido —el valor por
      #   defecto, 4, es de cuando los discos giraban y cada lectura aleatoria costaba—. **Hay que
      #   comprobarlo en el servidor** con `scripts/medir_consultas.py`, que mide y **muestra el
      #   plan**: los planes de este proyecto se eligieron midiendo, y algún plan puede empeorar. Si
      #   pasa, `BD_RANDOM_PAGE_COST=4` lo devuelve al valor de PostgreSQL sin tocar este archivo.
      # - **`work_mem` es por operación y por conexión**, no por base: 80 conexiones activas con
      #   tres ordenaciones cada una son 3,8 GB con 16 MB. Por eso está parametrizado y por eso
      #   conviene bajarlo a 8MB si la máquina es de 4 GB y aparece el asesino por memoria.
      # - **`maintenance_work_mem`** (trabajo a mano) va separado del de autovacuum: la tabla
      #   recibe filas muertas en cada ciclo de ingesta y el análisis automático no puede quedarse
      #   sin memoria, pero tampoco puede reservar 256 MB por trabajador.
      # - **Puntos de control**: la ingesta escribe a ráfagas (1.700 filas por vuelta). Con
      #   `max_wal_size` pequeño, cada ráfaga fuerza un punto de control y con él escrituras
      #   sincronizadas que paran todo lo demás.
      - postgres
      - -c
      - max_connections=${BD_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${BD_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${BD_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${BD_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=256MB
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - random_page_cost=${BD_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - wal_compression=on
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_naptime=30s
      - -c
      - log_min_duration_statement=1000
    volumes:
      - datos-bd:/var/lib/postgresql/data
    # `/dev/shm` vale 64 MB por defecto en un contenedor, y PostgreSQL lo usa para el paralelismo y
    # para construir índices. Con 64 MB, un `CREATE INDEX` de los grandes —o el `ANALYZE` de una
    # migración— falla con «could not resize shared memory segment», un error que no dice nada de la
    # causa y que aparece **al desplegar**, no en desarrollo. Esta es la línea que lo evita.
    shm_size: 512mb
    # 200 conexiones son 200 descriptores como mínimo, más los del WAL.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Diez segundos —el valor por defecto— no le dan tiempo a cerrar: PostgreSQL tiene que terminar
    # el punto de control y cerrar limpio. Si se le mata, la siguiente arranque hace recuperación y
    # tarda minutos con un histórico de este tamaño.
    stop_grace_period: 60s
    logging: *logging
    # No se publica el puerto a propósito: PostgreSQL solo se ve dentro de la red del compose.
    # Exponerlo a internet convierte un descuido de configuración en una brecha.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BD_USUARIO:-contratacion} -d ${BD_NOMBRE:-contratacion}"]
      interval: 10s
      timeout: 5s
      retries: 12

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Persistencia **activa**, y es un cambio de criterio que conviene entender.
    #
    # Mientras Redis solo guardaba caché, presencia y avisos, no persistir era lo correcto: todo se
    # podía reconstruir o volver a pedir, y un fichero que crece sin que nadie lo mire no aporta.
    #
    # Pero aquí viven también las **sesiones abiertas**. La ausencia de esa clave significa «sesión
    # cerrada», que es lo que hace funcionar el cierre por inactividad sin ninguna tarea que recorra
    # sesiones. Y esa virtud tiene un precio: si Redis arranca en blanco, **todas** las sesiones
    # dejan de constar y todo el mundo aparece en la pantalla de acceso a la vez. Sin persistencia,
    # cada reinicio del contenedor —o del servidor— es un cierre de sesión general.
    #
    # `appendfsync everysec` pierde como mucho un segundo de escrituras en una caída dura: unos
    # pocos inicios de sesión, que se resuelven volviendo a entrar. El fichero RDB periódico se deja
    # con los valores por defecto, que aceleran el arranque.
    #
    # `maxmemory` es obligatorio, no un adorno: la política de expulsión **solo actúa cuando hay un
    # límite**. Sin él, Redis crecería hasta agotar la memoria del servidor, y lo haría compitiendo
    # con PostgreSQL, que es quien no puede permitirse quedarse sin memoria.
    #
    # 512 MB son unas doscientas veces el consumo medido con cientos de usuarios, así que la
    # expulsión no llega a dispararse: el límite está como red de seguridad, no como régimen de
    # funcionamiento.
    #
    # **`allkeys-lru` no distingue la caché de las sesiones, y hay que decirlo.** Una versión
    # anterior de este comentario afirmaba que lo único que se podía perder eran entradas de caché, y
    # era falso: la política no mira para qué sirve cada clave, así que con el límite alcanzado
    # también desaloja claves de sesión. Lo que se pierde entonces no es un dato, es la respuesta a
    # «¿sigue viva esta sesión?».
    #
    # Eso dejó de ser un cierre de sesión general cuando la comprobación aprendió a distinguir una
    # clave **perdida** de una sesión **inactiva**: si la sesión se usó hace poco, la clave se repone
    # y la persona no nota nada. No hay que elegir entre `noeviction` —que ante la misma presión haría
    # fallar las escrituras, empezando por el propio inicio de sesión— y esta política: con la
    # reparación, la expulsión se queda en una consulta extra y un aviso en el registro.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
      # Cuando el límite **sí** se alcanza, liberar el valor desalojado es trabajo del único hilo que
      # tiene Redis, y ese hilo es el que atiende a los mil paneles. Con esto, la liberación se va a
      # un hilo de fondo y ninguna petición espera a que se recoja la basura. Es una red de
      # seguridad: con el consumo medido —megas— la expulsión no llega a dispararse.
      - --lazyfree-lazy-eviction
      - "yes"
      - --lazyfree-lazy-expire
      - "yes"
    # Las claves que más caducan son las de presencia, una por panel y sesenta segundos de vida: con
    # mil paneles son unas diecisiete expiraciones por segundo, cada una con liberación diferida.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Un `restart` manda SIGTERM y, a los diez segundos, SIGKILL. Con el AOF a `everysec`, el cierre
    # ordenado vacía lo que quede en el búfer: sin él se pierden los últimos inicios de sesión y el
    # fichero puede necesitar reparación al arrancar.
    stop_grace_period: 30s
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    # El diario del AOF tiene que vivir en un volumen y no en la capa de escritura del contenedor.
    # Sin esto, la persistencia solo sobreviviría a un `restart`: una actualización de imagen, un
    # `down` o un `up --build` recrean el contenedor y se llevarían por delante las sesiones, que es
    # exactamente lo que el AOF viene a evitar.
    volumes:
      - datos-cache:/data

  # ---------------------------------------------------------------------------
  # Procesos
  # ---------------------------------------------------------------------------
  migraciones:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${BD_USUARIO:-contratacion}:${BD_CLAVE}@bd:5432/${BD_NOMBRE:-contratacion}
    # Se ejecuta una vez y termina. Sin `restart`, un fallo se ve en los registros en vez de
    # reintentarse en silencio hasta que alguien mire.
    restart: "no"
    logging: *logging
    depends_on:
      bd:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Estas dos se construyen aquí a partir de las variables del entorno para que no haya que
      # repetir credenciales en `.env` con el nombre del servicio interno.
      DATABASE_URL: postgresql+asyncpg://${BD_USUARIO:-contratacion}:${BD_CLAVE}@bd:5432/${BD_NOMBRE:-contratacion}
      REDIS_URL: redis://cache:6379/0
      # Dónde viven las plantillas de Excel que sube cada empresa. Apunta al volumen de abajo y no al
      # directorio de trabajo: sin esto se escribirían en la capa del contenedor, y una actualización
      # de imagen —que recrea el contenedor— se llevaría por delante las plantillas de los clientes
      # sin ningún error y sin que nadie lo notara hasta la siguiente exportación.
      PLANTILLAS_DIR: /app/plantillas
    volumes:
      - datos-plantillas:/app/plantillas
    command:
      - uvicorn
      - contratacion.asgi:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --workers
      - ${API_WORKERS:-4}
      # Caddy reutiliza las conexiones contra el API, pero uvicorn cierra la suya a los cinco
      # segundos por defecto: con mil clientes, eso es abrir y cerrar conexiones constantemente, con
      # sus descriptores en `TIME_WAIT`. Un minuto deja margen de sobra bajo el de Caddy.
      - --timeout-keep-alive
      - "65"
      # La dirección real del cliente, para lo que se guarda como evidencia (la aceptación de
      # términos registra IP y agente). Sin esto, lo que se guarda es la IP del contenedor de Caddy.
      #
      # Confiar en la cabecera **solo es seguro porque el puerto del API está publicado únicamente en
      # `127.0.0.1`**, así que nadie de fuera puede hablar con él saltándose el proxy; quien pueda
      # ejecutar algo en esta máquina ya está dentro por otro camino. Si algún día se publica ese
      # puerto en todas las interfaces, esta línea convierte la cabecera en algo que cualquiera puede
      # inventarse.
      - --forwarded-allow-ips
      - "*"
    stop_grace_period: 30s
    logging: *logging
    ports:
      # Solo en la interfaz local: quien atiende a internet es Caddy. Publicarlo en todas las
      # interfaces saltaría el TLS y el límite de tamaño de las peticiones.
      - 127.0.0.1:8001:8001
    # Cada panel abierto mantiene una conexión al flujo de eventos, y cada conexión es un descriptor
    # de fichero. El límite del contenedor no se hereda de una sesión de shell: si no se fija, puede
    # quedarse en 1.024, y entonces el techo llega en mil conexiones repartidas entre los procesos con
    # un «too many open files» en una petición cualquiera, sin relación aparente con la presencia. Es
    # la primera pared al escalar y la que menos se ve venir.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${BD_USUARIO:-contratacion}:${BD_CLAVE}@bd:5432/${BD_NOMBRE:-contratacion}
      REDIS_URL: redis://cache:6379/0
    # Un solo worker de ingesta: el ciclo se protege con un bloqueo de asesoría de PostgreSQL, así
    # que un segundo proceso no duplicaría el trabajo, solo esperaría.
    command: ["python", "-m", "contratacion.tareas.worker"]
    logging: *logging
    depends_on:
      bd:
        condition: service_healthy
      cache:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Borde
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy es quien **mantiene** todas las conexiones abiertas de los clientes: cada flujo de
    # eventos vive aquí y en el proceso de API que lo atiende. Es el que antes se queda sin
    # descriptores, así que el límite se le pone explícito igual que al API.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?falta DOMINIO en el entorno}
      CORREO_TLS: ${CORREO_TLS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - datos-caddy:/data
      - config-caddy:/config
    logging: *logging
    depends_on:
      - api

volumes:
  datos-bd:
  datos-cache:
  datos-plantillas:
  datos-caddy:
  config-caddy:
